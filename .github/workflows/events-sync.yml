name: Collect official church events

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-events-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Collect due sources in bounded batches
        env:
          EVENTS_SYNC_TOKEN: ${{ secrets.EVENTS_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.EVENTS_SYNC_TOKEN;
          if (!token || token.length < 32) throw new Error('EVENTS_SYNC_TOKEN is not configured');
          const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let batch = 0; batch < 75; batch++) {
            let result;
            for (let attempt = 0; attempt < 4; attempt++) {
              let response;
              try {
                response = await fetch('https://airchurch.net/api/events/sync', {
                  method: 'POST', redirect: 'error',
                  headers: { authorization: `Bearer ${token}` },
                  // Event and news stages now run sequentially against D1.
                  signal: AbortSignal.timeout(90_000),
                });
              } catch (error) {
                if (attempt === 3) throw error;
                console.warn(`Batch ${batch + 1} request retry ${attempt + 1}: ${error instanceof Error ? error.message : 'unknown error'}`);
                await pause(15_000 * 2 ** attempt + Math.floor(Math.random() * 1_000));
                continue;
              }
              if (response.ok) {
                result = await response.json();
                break;
              }
              const retryable = [429, 502, 503, 504].includes(response.status);
              await response.body?.cancel();
              if (!retryable || attempt === 3) throw new Error(`Event collection failed: HTTP ${response.status}`);
              const retryAfter = Number(response.headers.get('retry-after'));
              const delay = Math.max(15_000 * 2 ** attempt, Number.isFinite(retryAfter) ? Math.min(120_000, retryAfter * 1_000) : 0);
              console.warn(`Batch ${batch + 1} temporary HTTP ${response.status}; retrying after ${delay / 1_000}s`);
              await pause(delay + Math.floor(Math.random() * 1_000));
            }
            if (result.ok !== true) throw new Error('Event collection returned an invalid result');
            console.log(`Batch ${batch + 1}: ${result.sourcesProcessed} event sources, ${result.newsSourcesProcessed ?? 0} news sources, ${result.published ?? 0} events published`);
            if (!result.sourcesProcessed && !result.newsSourcesProcessed) break;
            await pause(1_000);
          }
          JS
