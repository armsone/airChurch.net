name: Collect official church events

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-events-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Collect due sources in bounded batches
        env:
          EVENTS_SYNC_TOKEN: ${{ secrets.EVENTS_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.EVENTS_SYNC_TOKEN;
          if (!token || token.length < 32) throw new Error('EVENTS_SYNC_TOKEN is not configured');
          for (let batch = 0; batch < 75; batch++) {
            let result;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const response = await fetch('https://airchurch.net/api/events/sync', {
                  method: 'POST', redirect: 'error',
                  headers: { authorization: `Bearer ${token}` },
                  signal: AbortSignal.timeout(55_000),
                });
                if (response.ok) {
                  result = await response.json();
                  break;
                }
                if (![429, 502, 503, 504].includes(response.status) || attempt === 2) {
                  throw new Error(`Event collection failed: HTTP ${response.status}`);
                }
                console.warn(`Batch ${batch + 1} temporary HTTP ${response.status}; retrying`);
              } catch (error) {
                if (attempt === 2) throw error;
                console.warn(`Batch ${batch + 1} request retry ${attempt + 1}: ${error instanceof Error ? error.message : 'unknown error'}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 2_000 * (attempt + 1)));
            }
            if (result.ok !== true) throw new Error('Event collection returned an invalid result');
            console.log(`Batch ${batch + 1}: ${result.sourcesProcessed} event sources, ${result.newsSourcesProcessed ?? 0} news sources, ${result.published ?? 0} events published`);
            if (!result.sourcesProcessed && !result.newsSourcesProcessed) break;
          }
          JS
