name: Update public history

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-history-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-site-history.mjs
      - name: Save a new public history entry when needed
        run: |
          if git diff --quiet -- data/site-history.json; then exit 0; fi
          git config user.name "airChurch history"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-history.json
          git commit -m "chore(history): record public changes"
          git push
